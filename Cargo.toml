[workspace]
resolver = "3"
members = ["crates/pm-types", "crates/pm-core", "crates/pm-app", "crates/pm-ui"]
# The UI is WebAssembly and is built by trunk (see crates/pm-ui/Trunk.toml)
default-members = ["crates/pm-types", "crates/pm-core", "crates/pm-app"]

[workspace.package]
version = "0.5.8"
edition = "2024"
repository = "https://github.com/Stein-N/Project-Manager"

[workspace.dependencies]
pm-types = { path = "crates/pm-types" }
pm-core = { path = "crates/pm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.pm-ui]
opt-level = "z"
