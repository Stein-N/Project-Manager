[package]
name = "pm-core"
description = "Logic of the MC Mod Project Manager: projects, git worktrees, Gradle, changelogs, backports, Claude"
version.workspace = true
edition.workspace = true

[dependencies]
pm-types.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = "1"
regex = "1"
fancy-regex = "0.19"
os_pipe = "1"
comrak = "0.56"
ammonia = "4"
base64 = "0.23"
ureq = "3"
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
